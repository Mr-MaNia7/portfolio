<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abdulkarim G. Mohammed">
  <rect width="800" height="1000" fill="#141413"/>
  <g opacity="0.06" stroke="#FAF9F6" stroke-width="1.5">
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="750" x2="800" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
  </g>
  <!-- Head-and-shoulders silhouette, drawn as a single hairline -->
  <g stroke="#FAF9F6" stroke-opacity="0.16" stroke-width="3" fill="none">
    <circle cx="400" cy="420" r="120"/>
    <path d="M150 1000 C 170 760, 280 640, 400 640 C 520 640, 630 760, 650 1000"/>
  </g>
  <text x="400" y="430" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="150"
        font-weight="400" letter-spacing="-5" fill="#FAF9F6">AG</text>
  <rect x="360" y="520" width="80" height="6" fill="#C15F3C"/>
</svg>
